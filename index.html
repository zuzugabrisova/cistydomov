<!DOCTYPE html>
<html lang="sk" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Čistý Domov</title>
    <!-- PWA meta tags -->
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Čistý Domov">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1' }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; }
        .touch-none { touch-action: none; }
    </style>
</head>
<body class="h-full flex flex-col font-sans text-slate-800 dark:text-slate-100 dark:bg-slate-900 select-none">

    <!-- Header -->
    <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 px-4 py-3 flex justify-between items-center sticky top-0 z-10 shadow-sm">
        <div class="flex items-center gap-2">
            <div class="bg-primary-500 text-white p-2 rounded-xl shadow-md">
                <i data-lucide="sparkles" class="w-5 h-5"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg leading-tight">Čistý Domov</h1>
                <p id="current-date" class="text-xs text-slate-500 dark:text-slate-400 capitalize"></p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <div class="bg-amber-100 dark:bg-amber-900/40 text-amber-700 dark:text-amber-300 px-3 py-1 rounded-full text-xs font-semibold flex items-center gap-1 border border-amber-200 dark:border-amber-800">
                <i data-lucide="flame" class="w-3.5 h-3.5 fill-amber-500 text-amber-500"></i>
                <span id="streak-counter">0 dní</span>
            </div>
            <button id="theme-toggle" class="p-2 rounded-lg text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700">
                <i data-lucide="moon" class="w-5 h-5 dark:hidden"></i>
                <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto px-4 py-4 max-w-md mx-auto w-full custom-scrollbar space-y-5 pb-24">
        
        <!-- View: Today -->
        <div id="view-today" class="space-y-5">
            <!-- Day Task -->
            <section class="bg-gradient-to-br from-indigo-600 to-primary-600 text-white rounded-2xl p-4 shadow-lg relative overflow-hidden">
                <div class="absolute -right-4 -bottom-4 opacity-10 pointer-events-none">
                    <i data-lucide="home" class="w-32 h-32"></i>
                </div>
                <div class="flex items-center justify-between mb-1">
                    <span class="text-xs font-semibold uppercase tracking-wider text-indigo-200">Hlavná úloha dňa</span>
                    <span id="day-name" class="text-xs bg-white/20 px-2 py-0.5 rounded-md backdrop-blur-sm"></span>
                </div>
                <h2 id="day-task-title" class="text-xl font-bold mb-1"></h2>
                <p id="day-task-desc" class="text-xs text-indigo-100 mb-3"></p>
                <button id="btn-complete-daytask" class="w-full bg-white text-indigo-600 font-semibold text-sm py-2 px-4 rounded-xl shadow transition active:scale-95 flex items-center justify-center gap-2">
                    <i data-lucide="check-circle-2" class="w-4 h-4"></i>
                    <span id="daytask-btn-text">Označiť ako hotové</span>
                </button>
            </section>

            <!-- Routine Checklist -->
            <section class="bg-white dark:bg-slate-800 rounded-2xl p-4 border border-slate-200 dark:border-slate-700 shadow-sm">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="font-bold text-sm flex items-center gap-1.5">
                        <i data-lucide="check-square" class="w-4 h-4 text-primary-500"></i>
                        Denná rutina
                    </h3>
                    <span id="routine-progress" class="text-xs text-slate-500 dark:text-slate-400 font-medium">0/3</span>
                </div>
                <div id="routine-list" class="space-y-2"></div>
            </section>

            <!-- Decluttering Section -->
            <section class="bg-white dark:bg-slate-800 rounded-2xl p-4 border border-slate-200 dark:border-slate-700 shadow-sm space-y-3">
                <div class="flex justify-between items-center">
                    <div>
                        <h3 class="font-bold text-sm flex items-center gap-1.5">
                            <i data-lucide="box" class="w-4 h-4 text-emerald-500"></i>
                            Decluttering micro-zóna
                        </h3>
                        <p class="text-xs text-slate-500 dark:text-slate-400">Dnešná 15-minútová výzva</p>
                    </div>
                    <button id="btn-next-zone" title="Iná zóna" class="p-1.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700">
                        <i data-lucide="rotate-cw" class="w-4 h-4"></i>
                    </button>
                </div>

                <div id="zone-card" class="bg-slate-50 dark:bg-slate-900/50 p-3.5 rounded-xl border border-slate-100 dark:border-slate-800">
                    <div id="zone-empty" class="text-center py-4 hidden">
                        <p class="text-sm text-slate-500">Žiadne zóny na vyčistenie! Pridaj nové v Správe zón.</p>
                    </div>
                    <div id="zone-content">
                        <span id="zone-category" class="inline-block text-[10px] font-semibold uppercase tracking-wider text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-950/60 px-2 py-0.5 rounded-md mb-1"></span>
                        <h4 id="zone-title" class="font-bold text-base mb-2"></h4>
                        <div class="flex gap-2">
                            <button id="btn-start-timer" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-white font-semibold text-xs py-2 px-3 rounded-lg flex items-center justify-center gap-1.5 shadow-sm active:scale-95 transition">
                                <i data-lucide="play" class="w-3.5 h-3.5 fill-current"></i>
                                Start (15 min)
                            </button>
                            <button id="btn-complete-zone" class="bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 text-xs px-3 py-2 rounded-lg font-semibold flex items-center gap-1 active:scale-95 transition">
                                <i data-lucide="check" class="w-4 h-4"></i>
                                Hotovo
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Timer Modal/Overlay inside view -->
                <div id="timer-box" class="hidden bg-emerald-950 text-white p-4 rounded-xl flex flex-col items-center justify-center space-y-2 relative overflow-hidden">
                    <span class="text-xs font-medium text-emerald-300 uppercase tracking-widest">Časovač beží</span>
                    <div id="timer-display" class="text-4xl font-extrabold font-mono tracking-wider">15:00</div>
                    <div class="flex gap-2 w-full pt-1">
                        <button id="btn-pause-timer" class="flex-1 bg-emerald-800 hover:bg-emerald-700 text-xs py-1.5 rounded-lg font-semibold">Pauza</button>
                        <button id="btn-stop-timer" class="bg-emerald-900/80 hover:bg-emerald-900 text-xs py-1.5 px-3 rounded-lg text-emerald-200">Zrušiť</button>
                    </div>
                </div>
            </section>
        </div>

        <!-- View: Zones Management -->
        <div id="view-zones" class="hidden space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="font-bold text-base">Správa Decluttering zón</h2>
                <span id="zone-count" class="text-xs bg-slate-200 dark:bg-slate-700 px-2 py-0.5 rounded-full text-slate-600 dark:text-slate-300"></span>
            </div>

            <!-- Add new zone form -->
            <form id="add-zone-form" class="bg-white dark:bg-slate-800 p-3.5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-2">
                <input type="text" id="input-zone-title" placeholder="Názov micro-zónky (napr. Zásuvka s káblami)" required class="w-full text-xs px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 focus:outline-none focus:border-primary-500">
                <div class="flex gap-2">
                    <select id="input-zone-cat" class="text-xs px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 focus:outline-none focus:border-primary-500 flex-1">
                        <option value="Kuchyňa">Kuchyňa</option>
                        <option value="Kúpeľňa">Kúpeľňa</option>
                        <option value="Šatník">Šatník</option>
                        <option value="Obývačka">Obývačka</option>
                        <option value="Chodba">Chodba</option>
                        <option value="Papiere">Papiere & Dokumenty</option>
                        <option value="Rôzne">Rôzne</option>
                    </select>
                    <button type="submit" class="bg-primary-600 hover:bg-primary-700 text-white text-xs px-4 py-2 rounded-lg font-semibold flex items-center gap-1">
                        <i data-lucide="plus" class="w-4 h-4"></i>
                        Pridať
                    </button>
                </div>
            </form>

            <!-- Zones List -->
            <div id="manage-zones-list" class="space-y-2"></div>
        </div>

        <!-- View: Stats -->
        <div id="view-stats" class="hidden space-y-4">
            <h2 class="font-bold text-base">Štatistiky a Pokrok</h2>
            
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 text-center">
                    <i data-lucide="award" class="w-6 h-6 text-amber-500 mx-auto mb-1"></i>
                    <div id="stat-completed-count" class="text-2xl font-bold">0</div>
                    <div class="text-[11px] text-slate-500">Dokončených zón</div>
                </div>
                <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 text-center">
                    <i data-lucide="flame" class="w-6 h-6 text-orange-500 mx-auto mb-1"></i>
                    <div id="stat-streak" class="text-2xl font-bold">0</div>
                    <div class="text-[11px] text-slate-500">Séria dní v rade</div>
                </div>
            </div>

            <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700">
                <h3 class="font-bold text-sm mb-2">História dokončení</h3>
                <div id="history-list" class="space-y-2 text-xs max-h-60 overflow-y-auto custom-scrollbar"></div>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 px-6 py-2 flex justify-around items-center z-20">
        <button id="nav-today" class="nav-btn active flex flex-col items-center gap-0.5 text-primary-600 dark:text-primary-400">
            <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
            <span class="text-[10px] font-medium">Dnes</span>
        </button>
        <button id="nav-zones" class="nav-btn flex flex-col items-center gap-0.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
            <i data-lucide="list-todo" class="w-5 h-5"></i>
            <span class="text-[10px] font-medium">Zóny</span>
        </button>
        <button id="nav-stats" class="nav-btn flex flex-col items-center gap-0.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
            <i data-lucide="bar-chart-2" class="w-5 h-5"></i>
            <span class="text-[10px] font-medium">Prehľad</span>
        </button>
    </nav>

    <!-- JS Logic -->
    <script>
        // Initial Data Structures
        const DEFAULT_ROUTINES = [
            { id: 'r1', text: 'Ustlať posteľ ráno', completed: false },
            { id: 'r2', text: 'Vyprázdniť / Naložiť umývačku', completed: false },
            { id: 'r3', text: '5-minútový večerný zber vecí', completed: false }
        ];

        const WEEKLY_SCHEDULE = {
            1: { title: "Pondelok: Obývačka & Prach", desc: "Utrieť prach zo stolíkov, TV a poličiek." },
            2: { title: "Utorok: Podlahy & Vysávanie", desc: "Povysávať a umyť podlahy v celom byte." },
            3: { title: "Streda: Kúpeľňa & WC", desc: "Vyčistiť umývadlo, batérie, zrkadlo a WC." },
            4: { title: "Štvrtok: Pranie & Obliečky", desc: "Dať prať obliečky/uteráky alebo zložiť bielizeň." },
            5: { title: "Piatok: Kuchyňa & Spotrebiče", desc: "Utrieť kuchynskú linku, indukciu a mikrovlnku." },
            6: { title: "Sobota: Balkón / Chodba", desc: "Upratať topánky na chodbe a utrieť vchod." },
            0: { title: "Nedeľa: Oddych", desc: "Dnes iba základná denná rutina. Uži si voľno!" }
        };

        const DEFAULT_ZONES = [
            { id: 'z1', title: 'Zásuvka s príbormi', category: 'Kuchyňa', lastDone: null },
            { id: 'z2', title: 'Polička s korením', category: 'Kuchyňa', lastDone: null },
            { id: 'z3', title: 'Kozmetika v kúpeľni po záruke', category: 'Kúpeľňa', lastDone: null },
            { id: 'z4', title: 'Polička s tričkami v šatníku', category: 'Šatník', lastDone: null },
            { id: 'z5', title: 'Staré pošty a papiere na stole', category: 'Papiere', lastDone: null },
            { id: 'z6', title: 'Káble a nabíjačky v obývačke', category: 'Rôzne', lastDone: null },
            { id: 'z7', title: 'Lieky a lekárnička', category: 'Kúpeľňa', lastDone: null }
        ];

        // State Management
        let appState = {
            streak: 0,
            lastStreakDate: null,
            dayTaskCompletedDate: null,
            routines: DEFAULT_ROUTINES,
            routineLastReset: null,
            zones: DEFAULT_ZONES,
            currentZoneId: null,
            history: []
        };

        let timerInterval = null;
        let timerSeconds = 15 * 60;

        // Helper Functions
        function getTodayString() {
            return new Date().toISOString().split('T')[0];
        }

        function loadState() {
            const saved = localStorage.getItem('clean_app_state');
            if (saved) {
                try { appState = { ...appState, ...JSON.parse(saved) }; } catch(e){}
            }
            checkDailyReset();
            saveState();
        }

        function saveState() {
            localStorage.setItem('clean_app_state', JSON.stringify(appState));
            renderAll();
        }

        function checkDailyReset() {
            const today = getTodayString();
            if (appState.routineLastReset !== today) {
                appState.routines.forEach(r => r.completed = false);
                appState.routineLastReset = today;
            }
            if (!appState.currentZoneId && appState.zones.length > 0) {
                pickRandomZone();
            }
        }

        function pickRandomZone() {
            if (appState.zones.length === 0) {
                appState.currentZoneId = null;
                return;
            }
            // Pick zones not done today first
            const uncompleted = appState.zones.filter(z => z.lastDone !== getTodayString());
            const pool = uncompleted.length > 0 ? uncompleted : appState.zones;
            const random = pool[Math.floor(Math.random() * pool.length)];
            appState.currentZoneId = random.id;
        }

        // Render Functions
        function renderAll() {
            // Header Info
            const options = { weekday: 'long', day: 'numeric', month: 'long' };
            document.getElementById('current-date').innerText = new Date().toLocaleDateString('sk-SK', options);
            document.getElementById('streak-counter').innerText = `${appState.streak} dní`;
            document.getElementById('stat-streak').innerText = appState.streak;

            // Day Task Section
            const dayOfWeek = new Date().getDay();
            const todaySchedule = WEEKLY_SCHEDULE[dayOfWeek];
            const isDayTaskDone = appState.dayTaskCompletedDate === getTodayString();

            document.getElementById('day-name').innerText = new Date().toLocaleDateString('sk-SK', { weekday: 'short' });
            document.getElementById('day-task-title').innerText = todaySchedule.title;
            document.getElementById('day-task-desc').innerText = todaySchedule.desc;

            const dayBtn = document.getElementById('btn-complete-daytask');
            const dayBtnText = document.getElementById('daytask-btn-text');
            if (isDayTaskDone) {
                dayBtn.className = "w-full bg-emerald-500 text-white font-semibold text-sm py-2 px-4 rounded-xl shadow flex items-center justify-center gap-2";
                dayBtnText.innerText = "Dokončené Dnes ✓";
            } else {
                dayBtn.className = "w-full bg-white text-indigo-600 font-semibold text-sm py-2 px-4 rounded-xl shadow transition active:scale-95 flex items-center justify-center gap-2";
                dayBtnText.innerText = "Označiť ako hotové";
            }

            // Routines
            const routineList = document.getElementById('routine-list');
            routineList.innerHTML = '';
            let completedRoutines = 0;

            appState.routines.forEach(r => {
                if (r.completed) completedRoutines++;
                const item = document.createElement('div');
                item.className = `flex items-center justify-between p-2.5 rounded-xl border transition cursor-pointer ${
                    r.completed ? 'bg-slate-50 dark:bg-slate-900/40 border-slate-100 dark:border-slate-800 text-slate-400 line-through' : 'bg-slate-50 dark:bg-slate-900 border-slate-200 dark:border-slate-700'
                }`;
                item.innerHTML = `
                    <span class="text-xs font-medium">${r.text}</span>
                    <input type="checkbox" ${r.completed ? 'checked' : ''} class="w-4 h-4 rounded text-primary-600 focus:ring-0">
                `;
                item.onclick = () => {
                    r.completed = !r.completed;
                    saveState();
                    if(r.completed && typeof confetti === 'function') confetti({ particleCount: 20, spread: 40, origin: { y: 0.8 } });
                };
                routineList.appendChild(item);
